{% extends 'polls/dashboard_base.html' %}

{% block title %}Настройки команды - PollStream{% endblock %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-3xl font-bold text-gray-900">Настройки команды</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold text-gray-900 mb-6">Основные параметры</h2>
        
        <form class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Название команды</label>
                <input type="text" placeholder="Введите название команды" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400" />
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Описание</label>
                <textarea rows="4" placeholder="Опишите вашу команду" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400"></textarea>
            </div>
            
            <div class="border-t pt-6">
                <button type="button" disabled class="px-6 py-2 bg-gray-400 text-white rounded-lg font-medium cursor-not-allowed">Сохранить изменения (в разработке)</button>
            </div>
        </form>
    </div>
    
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold text-gray-900 mb-6">Приватность и безопасность</h2>
        
        <div class="space-y-4">
            <label class="flex items-center">
                <input type="checkbox" class="w-4 h-4 rounded border-gray-300" />
                <span class="ml-3 text-gray-700">Сделать команду приватной</span>
            </label>
            
            <label class="flex items-center">
                <input type="checkbox" class="w-4 h-4 rounded border-gray-300" />
                <span class="ml-3 text-gray-700">Требовать одобрение для новых членов</span>
            </label>
        </div>
    </div>
</div>
{% endblock %}
