{% extends 'polls/dashboard_base.html' %}

{% block title %}Члены команды - PollStream{% endblock %}

{% block content %}
<div class="space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-3xl font-bold text-gray-900">Члены команды</h1>
        <button class="px-4 py-2 bg-indigo-600 text-white rounded-lg font-medium hover:bg-indigo-700 transition">Пригласить члена</button>
    </div>
    
    <div class="bg-white rounded-lg shadow overflow-hidden">
        <table class="w-full">
            <thead class="bg-gray-50 border-b">
                <tr>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Имя</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Email</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Роль</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Статус</th>
                    <th class="px-6 py-3 text-left text-sm font-semibold text-gray-900">Действия</th>
                </tr>
            </thead>
            <tbody class="divide-y">
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-4 text-sm text-gray-900">{{ request.user.get_full_name|default:request.user.username }}</td>
                    <td class="px-6 py-4 text-sm text-gray-600">{{ request.user.email }}</td>
                    <td class="px-6 py-4 text-sm"><span class="px-3 py-1 bg-indigo-100 text-indigo-800 rounded-full text-xs font-semibold">Владелец</span></td>
                    <td class="px-6 py-4 text-sm"><span class="px-3 py-1 bg-green-100 text-green-800 rounded-full text-xs font-semibold">Активен</span></td>
                    <td class="px-6 py-4 text-sm text-gray-600">
                        <button class="text-indigo-600 hover:text-indigo-800 font-medium">Управление</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
