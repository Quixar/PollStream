{% extends 'polls/dashboard_base.html' %}

{% block title %}Мой аккаунт - PollStream{% endblock %}

{% block content %}
<div class="space-y-6">
    <h1 class="text-3xl font-bold text-gray-900">Мой аккаунт</h1>
    
    <div class="bg-white rounded-lg shadow p-6">
        <h2 class="text-xl font-semibold text-gray-900 mb-6">Информация профиля</h2>
        
        <form class="space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Имя пользователя</label>
                    <input type="text" value="{{ request.user.username }}" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-800">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" value="{{ request.user.email }}" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-800">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Имя</label>
                    <input type="text" value="{{ request.user.first_name }}" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-800">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Фамилия</label>
                    <input type="text" value="{{ request.user.last_name }}" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-800">
                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Номер телефона</label>
                    <input type="tel" placeholder="+380 (XX) XXX-XX-XX" class="w-full px-4 py-2 border border-gray-300 rounded-lg text-gray-800 placeholder-gray-400">

                </div>
                
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Дата присоединения</label>
                    <input type="text" value="{{ request.user.date_joined|date:'d.m.Y' }}" readonly class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-800">
                </div>
            </div>
            
            <div class="border-t pt-6">
                <button type="button" disabled class="px-6 py-2 bg-gray-400 text-white rounded-lg font-medium cursor-not-allowed">Редактировать профиль</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
